<script>

window.addEventListener("DOMContentLoaded", () => {
    const bg2 = document.getElementById("bg2");

    if (!bg2) return;

    // Bắt sự kiện cuộn trang web
    window.addEventListener("scroll", () => {
      // 1. Quãng đường đã cuộn xuống (pixel)
      const scrollTop = window.scrollY;

      // 2. Tổng quãng đường có thể cuộn tối đa
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;

      if (maxScroll > 0) {
        // 3. Quy đổi thành % từ 0 đến 100
        const scrollPercent = (scrollTop / maxScroll) * 100;

        // 4. Cập nhật góc nhìn cho ảnh bg2
        bg2.style.objectPosition = `center ${scrollPercent}%`;
      }
    });
  });

  
 function flash() {

 const soundflower = document.getElementById("flower");  
   document.body.classList.add("flash");
   soundtele.currentTime = 0.3;

soundtele.play();
soundtele.addEventListener("ended", () => {
  soundflower.currentTime = 0;
  soundflower.play();
}, { once: true });
   
document.getElementById("JumpLayer").style.display = "none";
 document.getElementById("layer2").style.display = "flex";  document.body.addEventListener("animationend", function() {

 }

];

function buildBgPicker() {
  const panel = document.getElementById("bgPickerPanel");
  panel.innerHTML = ""; // xoá cũ nếu build lại

  bgOptions.forEach(opt => {
    const thumb = document.createElement("img");
    thumb.src = opt.src;
    thumb.title = opt.name;
    thumb.onclick = () => setBackground(opt.src);
    panel.appendChild(thumb);
  });
}

function setBackground(src) {
  const bg2 = document.getElementById("bg2");
  if (bg2) bg2.src = src;
}

function toggleBgPicker() {
  const panel = document.getElementById("bgPickerPanel");
  panel.style.display = (panel.style.display === "none") ? "flex" : "none";
}

// Build panel khi trang load
window.addEventListener("DOMContentLoaded", buildBgPicker);


  function showItemPopup(iconSrc, text, duration = 2000) {
  const overlay = document.getElementById("itemPopupOverlay");
  const icon = document.getElementById("itemPopupIcon");
  const textEl = document.getElementById("itemPopupText");

  icon.src = iconSrc;
  textEl.innerHTML = text;
  overlay.style.display = "flex";

  // Bấm vào đâu cũng tắt ngay
  overlay.onclick = () => hideItemPopup();

  // Tự tắt sau `duration` ms (nếu muốn tự động, bỏ dòng dưới nếu chỉ muốn tắt bằng click)
  clearTimeout(overlay._autoHideTimer);
  overlay._autoHideTimer = setTimeout(() => hideItemPopup(), duration);
}

function hideItemPopup() {
  document.getElementById("itemPopupOverlay").style.display = "none";
}

   function buildFireRow(count = 5) {
  const container = document.getElementById("fire2");
  container.innerHTML = "";
  const center = (count - 1) / 2; // vị trí tâm (vd count=5 → center=2)

  for (let i = 0; i < count; i++) {
    const img = document.createElement("img");
    img.src = "fire.gif";
    const distance = Math.abs(i - center); // khoảng cách tới tâm
    img.style.setProperty("--delay", distance * 0); // càng xa tâm càng trễ
    container.appendChild(img);
  }
    }
  function showFire2() {
  buildFireRow(31); // tạo lại để animation chạy lại từ đầu mỗi lần gọi
  document.getElementById("fire2").style.display = "flex";
  }
  function toggleCandy() {
  const img = document.getElementById("candy");
  if (img.src.includes("candy.png")) {
    img.src = "Kana.gif";
  } else {
    img.src = "candy.png";
  }
  }
  function toggleImageAndSfx(imgId, srcA, srcB, sfxA, sfxB) {
  const img = document.getElementById(imgId);
  if (!img) return;

  // Lấy tên file hiện tại để so sánh (bỏ qua phần đường dẫn đầy đủ nếu có)
  const isA = img.src.includes(srcA);

  if (isA) {
    img.src = srcB;
    if (sfxB) playSfx(sfxB);
  } else {
    img.src = srcA;
    if (sfxA) playSfx(sfxA);
  }
  }
    function flash2() {

  document.body.addEventListener("animationend", function() {

  }, { once: true });
